[workspace]
resolver = "2"
members = [
    "apps/native",
    "apps/web",
    "crates/application",
    "crates/model",
    "crates/game-state",
    "crates/protocol",
    "crates/cache",
    "crates/scene",
    "crates/client-script",
    "crates/renderer",
    "crates/game-ui",
    "crates/shell-ui",
    "crates/input",
    "crates/audio",
    "crates/platform",
    "crates/platform-native",
    "crates/platform-web",
    "crates/plugin-api",
    "crates/plugin-host",
    "crates/plugin-runtime-native",
    "crates/plugin-runtime-web",
    "plugin-sdk/rust",
    "xtask",
]
exclude = ["references/rustosrs"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Neosback/rustclient"

[workspace.dependencies]
glam = "0.30"
futures-channel = "0.3"
bzip2 = "0.6.1"
bytemuck = { version = "1.25", features = ["derive"] }
crc32fast = "1.5"
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
num-bigint = { package = "num-bigint-dig", version = "0.8.6", default-features = false, features = ["zeroize", "u64_digit"] }
zeroize = "1.8"
getrandom = "0.3"

base64 = "0.22.1"
js-sys = "0.3.104"
pollster = "0.4.0"
wasm-bindgen = "0.2.127"
wasm-bindgen-futures = "0.4.54"
web-sys = "0.3.104"
wgpu = "30.0.1"
winit = "0.30.13"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
# Rust 1.99 introduced style-only lints across pre-existing code. Keep CI focused on
# behavioral warnings until those migrations are handled deliberately outside protocol work.
chunks_exact_to_as_chunks = "allow"
manual_midpoint = "allow"
assert_is_empty = "allow"
