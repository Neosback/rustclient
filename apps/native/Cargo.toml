[package]
name = "rustclient-native"
default-run = "rustclient-native"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
rustclient-shell-ui = { path = "../../crates/shell-ui" }
keyboard-types = "=0.7.0"
rustclient-scene = { path = "../../crates/scene" }
getrandom.workspace = true
zeroize.workspace = true
rustclient-protocol = { path = "../../crates/protocol" }
rustclient-platform = { path = "../../crates/platform" }
rustclient-model = { path = "../../crates/model" }
image.workspace = true
wgpu.workspace = true
rustclient-application = { path = "../../crates/application" }
rustclient-cache = { path = "../../crates/cache" }
rustclient-game-ui = { path = "../../crates/game-ui" }
rustclient-game-state = { path = "../../crates/game-state" }
rustclient-input = { path = "../../crates/input" }
rustclient-platform-native = { path = "../../crates/platform-native" }
rustclient-plugin-api = { path = "../../crates/plugin-api" }
rustclient-plugin-bridge = { path = "../../crates/plugin-bridge" }
rustclient-first-party-plugins = { path = "../../crates/first-party-plugins" }
rustclient-plugin-host = { path = "../../crates/plugin-host" }
rustclient-plugin-runtime-native = { path = "../../crates/plugin-runtime-native" }

pollster.workspace = true
rustclient-renderer = { path = "../../crates/renderer" }
winit.workspace = true
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }

[lints]
workspace = true

# Diagnostic executables run explicitly; they contain no Rust test cases.
# Keep them in all-target check/Clippy without empty cargo-test harnesses.

[[bin]]
name = "entity_probe"
path = "src/bin/entity_probe.rs"
test = false
bench = false

