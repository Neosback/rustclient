[package]
name = "rustclient-web"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
# No unit cases; keep doctests and target checks enabled. Re-enable when adding unit tests.
test = false
crate-type = ["cdylib", "rlib"]

[dependencies]
rustclient-renderer = { path = "../../crates/renderer" }
rustclient-shell-ui = { path = "../../crates/shell-ui" }
rustclient-application = { path = "../../crates/application" }
rustclient-plugin-host = { path = "../../crates/plugin-host" }
rustclient-platform = { path = "../../crates/platform" }
rustclient-platform-web = { path = "../../crates/platform-web" }
keyboard-types = "=0.7.0"
winit.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys = { workspace = true, features = ["console", "Window", "Document", "Location", "Performance", "ClipboardEvent", "DataTransfer", "HtmlCanvasElement"] }

[lints]
workspace = true
